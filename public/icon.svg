<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwa-v-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006636" />
      <stop offset="50%" stop-color="#008846" />
      <stop offset="100%" stop-color="#059A4E" />
    </linearGradient>

    <linearGradient id="pwa-v-fold" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#014A26" />
      <stop offset="100%" stop-color="#00351B" />
    </linearGradient>

    <linearGradient id="pwa-v-right" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#028A44" />
      <stop offset="50%" stop-color="#16A34A" />
      <stop offset="85%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#3CD070" />
    </linearGradient>

    <linearGradient id="pwa-v-base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007A3E" />
      <stop offset="100%" stop-color="#1DBB59" />
