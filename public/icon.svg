  </defs>

  <!-- Clean Rounded Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" />

  <!-- V-Cart Growth Symbol -->
  <g>
    <!-- Left Ribbon Handle & Stem -->
    <path d="M 110 166 C 104 166 100 171 100 177 C 100 183 104 188 110 188 L 155 188 C 182 188 206 216 226 264 C 244 306 264 322 284 316 C 272 322 254 322 238 312 C 214 296 194 256 174 212 C 160 180 138 166 110 166 Z" fill="url(#pwa-v-left)" />

    <!-- 3D Ribbon Fold Shadow -->
