    <!-- Right Wing & Soaring Growth Arrow -->
    <path d="M 238 312 C 256 322 280 316 296 292 L 368 184 L 326 172 L 404 124 L 410 208 L 376 196 L 294 300 C 276 324 252 324 238 312 Z" fill="url(#pwa-v-right)" />

    <!-- Cart Base Tray Bar -->
    <rect x="176" y="324" width="134" height="24" rx="12" fill="url(#pwa-v-base)" />

    <!-- Cart Wheels -->
    <circle cx="204" cy="374" r="19" fill="#007A3E" />
    <circle cx="286" cy="374" r="19" fill="#007A3E" />
